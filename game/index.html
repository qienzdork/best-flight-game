<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L20 14 L30 16 L20 18 L16 30 L12 18 L2 16 L12 14 Z' fill='%23ffb020'/%3E%3C/svg%3E">
<title>Skyline Run — Best Flight Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyline Run: fly the jet through the ring course over the valley, then land on the runway at Skyline Field"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
